  <h1>Datenschutzerklärung STRAKI</h1>
  <p>STRAKI ist ein Offline-Brettspiel. Die App speichert keine Konten, sendet keine Spieldaten an Server und zeigt keine Werbung.</p>
  <p>Es werden keine personenbezogenen Daten erhoben. Züge bleiben auf dem Gerät.</p>
  <p>Spielregeln und Marke: <a href="https://straki.org">straki.org</a> (Athanasios Gakis).</p>
