name: Build STRAKI.exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: EXE bauen
        run: python scripts/build_exe.py
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: STRAKI-Windows
          path: dist/STRAKI.exe
          if-no-files-found: error
      - name: GitHub-Release mit Download-Link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: STRAKI für Windows
          files: dist/STRAKI.exe
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            **STRAKI.exe** herunterladen, entpacken ist nicht nötig.

            Doppelklick startet das Spiel. Python muss nicht installiert sein.

            Windows kann beim ersten Start SmartScreen anzeigen, weil die Datei nicht digital signiert ist: *Weitere Informationen* → *Trotzdem ausführen*.
